name: Feature request
description: Propose a new capability or a change in behavior.
title: "[Feature]: "
labels: ["type:feature"]
body:
  - type: markdown
    attributes:
      value: |
        Describe the problem first. A solution without a problem is hard to evaluate.
        Architectural changes may require a design issue before implementation.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is hard, missing, or risky today? Who is affected?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should happen? Include user-visible behavior and examples.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches, workarounds, or reasons to do nothing.
    validations:
      required: false
  - type: textarea
    id: scope
    attributes:
      label: Scope and non-goals
      description: What this proposal includes and explicitly does not include.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Observable behavior that would make this complete.
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues and documentation.
          required: true
        - label: This is not a security vulnerability report.
          required: true
